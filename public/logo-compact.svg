<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield Body -->
  <path d="M50 5 L88 20 L88 50 C88 73 50 95 50 95 C50 95 12 73 12 50 L12 20 Z"
        fill="url(#shieldGrad2)"/>

  <!-- 3D Edge - Right -->
  <path d="M50 5 L88 20 L88 50 C88 73 50 95 50 95 L50 5 Z"
        fill="rgba(255,255,255,0.15)"/>

  <!-- 3D Edge - Bottom Shadow -->
  <path d="M50 95 C50 95 12 73 12 50 L12 55 C12 75 50 93 50 93 Z"
        fill="rgba(0,0,0,0.2)"/>

  <!-- Checkmark with Glow -->
  <g filter="url(#glow)">
    <path d="M28 48 L40 60 L72 28"
          fill="none" stroke="url(#checkGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Checkmark Highlight -->
  <path d="M28 48 L40 60 L72 28"
        fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
